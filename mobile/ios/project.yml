name: OurWord
options:
  bundleIdPrefix: com.yeeroo
  deploymentTarget:
    iOS: "15.0"
targets:
  OurWord:
    type: application
    platform: iOS
    sources:
      - OurWord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeeroo.ourword
        PRODUCT_NAME: OurWord
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Our Word
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.word-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
schemes:
  OurWord:
    build:
      targets:
        OurWord: all
    archive:
      config: Release
