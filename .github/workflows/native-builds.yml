name: Build SideStore IPA and Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/native-builds.yml'
permissions:
  contents: read
jobs:
  sidestore:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build IPA for SideStore re-signing
        run: bash mobile/ios/build-sidestore.sh
      - name: Check IPA structure
        run: unzip -l mobile/ios/build/OurWord-SideStore.ipa | grep 'Payload/OurWord.app/OurWord'
      - uses: actions/upload-artifact@v4
        with:
          name: OurWord-SideStore
          path: mobile/ios/build/OurWord-SideStore.ipa
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable debug APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OurWord-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
